name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage site
        # moovers root, ARSmoving, grooming, and bali landings all live at
        # *.axveer.io now. ARSmoving + grooming source moved into their own
        # repos; bali source remains here for future Kamal deploy. Pages
        # only hosts redirect stubs at those four paths plus archived /old/.
        run: |
          mkdir _site
          cp -r old _site/

      - name: Write redirects to production *.axveer.io
        run: |
          write_redirect() {
            local dir="$1"
            local target="$2"
            mkdir -p "_site/${dir}"
            cat > "_site/${dir}/index.html" <<HTML
          <!DOCTYPE html>
          <html lang="en"><head>
          <meta charset="UTF-8">
          <meta http-equiv="refresh" content="0; url=${target}">
          <link rel="canonical" href="${target}">
          <title>Moved to ${target}</title>
          </head><body>
          <p>This page has moved. Redirecting to <a href="${target}">${target}</a>.</p>
          <script>window.location.replace("${target}");</script>
          </body></html>
          HTML
          }
          write_redirect ""          "https://moovers.axveer.io/"
          write_redirect "ARSmoving" "https://arsmoving.axveer.io/"
          write_redirect "grooming"  "https://grooming.axveer.io/"
          write_redirect "bali"      "https://bali.axveer.io/"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
