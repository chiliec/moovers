name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # test:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-node@v4
  #       with:
  #         node-version: '22'
  #     - name: Run pricing engine tests
  #       run: node --test pricing.test.mjs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build ARSmoving
        working-directory: ARSmoving
        run: |
          npm ci
          npm run build

      - name: Stage site
        run: |
          mkdir _site
          cp index.html script.js styles.css _site/
          cp -r assets _site/
          cp -r old _site/
          cp -r grooming _site/
          cp -r bali _site/
          cp -r ARSmoving/dist _site/ARSmoving

      - name: Replace landing pages with redirects to production *.axveer.io
        # Real source stays canonical on main (Kamal will serve it per-subdomain).
        # Pages only hosts redirect stubs at the four landing paths; /old/ stays as-is.
        run: |
          write_redirect() {
            local dir="$1"
            local target="$2"
            mkdir -p "_site/${dir}"
            cat > "_site/${dir}/index.html" <<HTML
          <!DOCTYPE html>
          <html lang="en"><head>
          <meta charset="UTF-8">
          <meta http-equiv="refresh" content="0; url=${target}">
          <link rel="canonical" href="${target}">
          <title>Moved to ${target}</title>
          </head><body>
          <p>This page has moved. Redirecting to <a href="${target}">${target}</a>.</p>
          <script>window.location.replace("${target}");</script>
          </body></html>
          HTML
          }
          write_redirect ""          "https://moovers.axveer.io/"
          write_redirect "ARSmoving" "https://arsmoving.axveer.io/"
          write_redirect "grooming"  "https://grooming.axveer.io/"
          write_redirect "bali"      "https://bali.axveer.io/"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
